<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POI•LOVE · Media</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#EAE4D8;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
 color:#1C1C1C;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.scene{width:min(680px,94vw)}
svg{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.txt{text-align:center;margin-top:22px;max-width:560px}
.txt h1{font-size:22px;letter-spacing:-.4px;margin-bottom:6px}
.txt h1 b{color:#D42B2B}
.txt p{color:#6B6B6B;font-size:14.5px;margin-bottom:16px}
.btn{display:inline-block;background:#D42B2B;color:#fff;text-decoration:none;font-weight:700;
 font-size:14px;border-radius:99px;padding:11px 26px;box-shadow:0 4px 14px rgba(212,43,43,.3)}
.btn:hover{transform:translateY(-1px)}
/* ── vita dietro lo spioncino ── */
.hatch{transform-box:fill-box;transform-origin:8% 50%;animation:apri 1.1s .9s cubic-bezier(.6,-0.2,.3,1.2) forwards}
@keyframes apri{to{transform:rotate(-118deg)}}
.eyes{opacity:0;animation:appari .4s 1.7s forwards}
@keyframes appari{to{opacity:1}}
.pupille{animation:sbircia 7s 2.2s ease-in-out infinite}
@keyframes sbircia{0%,100%{transform:translate(0,0)}12%{transform:translate(-7px,1px)}26%{transform:translate(-7px,1px)}
 38%{transform:translate(8px,-1px)}55%{transform:translate(8px,-1px)}68%{transform:translate(0,2px)}82%{transform:translate(0,0)}}
.palp{transform-box:fill-box;transform-origin:center;animation:batti 4.6s 2.6s infinite}
@keyframes batti{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}98%{transform:scaleY(1)}}
.nube{animation:vaga 26s linear infinite alternate}
.nube2{animation:vaga 34s linear infinite alternate-reverse}
@keyframes vaga{from{transform:translateX(0)}to{transform:translateX(60px)}}
</style>
</head>
<body>
<div class="scene">
<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Il portone dell'archivio, con ILLI che sbircia dallo spioncino">
 <defs>
  <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#f6d9a8"/><stop offset=".55" stop-color="#e9b98a"/><stop offset="1" stop-color="#d9987b"/>
  </linearGradient>
  <linearGradient id="legno" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0" stop-color="#5a4030"/><stop offset=".5" stop-color="#6d4e3a"/><stop offset="1" stop-color="#54392b"/>
  </linearGradient>
  <radialGradient id="buio" cx=".5" cy=".5" r=".6">
   <stop offset="0" stop-color="#241a14"/><stop offset="1" stop-color="#0e0906"/>
  </radialGradient>
 </defs>

 <!-- cielo e sole -->
 <rect width="900" height="620" fill="url(#cielo)"/>
 <circle cx="700" cy="120" r="46" fill="#fff3d6" opacity=".9"/>
 <g class="nube" opacity=".85"><ellipse cx="180" cy="100" rx="70" ry="20" fill="#fff"/><ellipse cx="235" cy="88" rx="45" ry="16" fill="#fff"/></g>
 <g class="nube2" opacity=".7"><ellipse cx="520" cy="70" rx="55" ry="16" fill="#fff"/><ellipse cx="565" cy="60" rx="35" ry="12" fill="#fff"/></g>

 <!-- montagne (le Alpi albanesi) -->
 <polygon points="0,330 140,150 260,300 360,190 470,330 900,330 900,620 0,620" fill="#7d8a7a"/>
 <polygon points="118,178 140,150 162,178" fill="#f4efe4"/>
 <polygon points="338,218 360,190 384,218" fill="#f4efe4"/>
 <polygon points="300,380 470,220 620,360 720,260 900,400 900,620 0,620 0,380" fill="#5d6f5c"/>
 <polygon points="0,620 0,430 250,430 900,460 900,620" fill="#4a5747"/>

 <!-- sentiero -->
 <path d="M370,620 C400,540 430,510 450,470 L510,470 C530,520 540,560 560,620 Z" fill="#c9b795"/>

 <!-- cornice di pietra -->
 <path d="M290,620 L290,300 Q290,190 450,190 Q610,190 610,300 L610,620 Z" fill="#8e8578"/>
 <path d="M312,620 L312,308 Q312,212 450,212 Q588,212 588,308 L588,620 Z" fill="#a99f8f"/>
 <!-- conci di pietra -->
 <g stroke="#7c7365" stroke-width="2" opacity=".5">
  <line x1="290" y1="380" x2="312" y2="380"/><line x1="290" y1="470" x2="312" y2="470"/><line x1="290" y1="555" x2="312" y2="555"/>
  <line x1="588" y1="380" x2="610" y2="380"/><line x1="588" y1="470" x2="610" y2="470"/><line x1="588" y1="555" x2="610" y2="555"/>
  <line x1="360" y1="196" x2="352" y2="216"/><line x1="450" y1="190" x2="450" y2="212"/><line x1="540" y1="196" x2="548" y2="216"/>
 </g>

 <!-- il portone -->
 <path d="M322,620 L322,312 Q322,222 450,222 Q578,222 578,312 L578,620 Z" fill="url(#legno)"/>
 <!-- assi verticali -->
 <g stroke="#3f2c20" stroke-width="2.5" opacity=".6">
  <line x1="386" y1="238" x2="386" y2="620"/><line x1="450" y1="222" x2="450" y2="620"/><line x1="514" y1="238" x2="514" y2="620"/>
 </g>
 <!-- bande di ferro con chiodi -->
 <g fill="#2e2a26">
  <rect x="322" y="330" width="256" height="16" rx="3"/>
  <rect x="322" y="560" width="256" height="16" rx="3"/>
 </g>
 <g fill="#8f877c">
  <circle cx="340" cy="338" r="3.4"/><circle cx="392" cy="338" r="3.4"/><circle cx="450" cy="338" r="3.4"/><circle cx="508" cy="338" r="3.4"/><circle cx="560" cy="338" r="3.4"/>
  <circle cx="340" cy="568" r="3.4"/><circle cx="392" cy="568" r="3.4"/><circle cx="450" cy="568" r="3.4"/><circle cx="508" cy="568" r="3.4"/><circle cx="560" cy="568" r="3.4"/>
 </g>
 <!-- finestrella con sbarre, da prigione -->
 <path d="M410,258 Q410,238 450,238 Q490,238 490,258 L490,300 L410,300 Z" fill="url(#buio)"/>
 <g stroke="#2e2a26" stroke-width="5" stroke-linecap="round">
  <line x1="424" y1="242" x2="424" y2="300"/><line x1="450" y1="238" x2="450" y2="300"/><line x1="476" y1="242" x2="476" y2="300"/>
 </g>

 <!-- catena e lucchetto -->
 <g fill="none" stroke="#4c4640" stroke-width="7" opacity=".9">
  <ellipse cx="352" cy="500" rx="9" ry="13"/><ellipse cx="368" cy="507" rx="9" ry="13"/><ellipse cx="384" cy="514" rx="9" ry="13"/>
 </g>
 <g>
  <rect x="392" y="512" width="34" height="28" rx="6" fill="#c9a22e"/>
  <path d="M399,512 v-8 a10,10 0 0 1 20,0 v8" fill="none" stroke="#c9a22e" stroke-width="6"/>
  <circle cx="409" cy="524" r="4" fill="#7a6114"/>
 </g>
 <!-- maniglione -->
 <circle cx="530" cy="470" r="14" fill="none" stroke="#2e2a26" stroke-width="7"/>
 <circle cx="530" cy="452" r="7" fill="#2e2a26"/>

 <!-- LO SPIONCINO -->
 <g>
  <!-- il buco: buio, con gli occhietti di ILLI -->
  <circle cx="450" cy="420" r="40" fill="url(#buio)"/>
  <g class="eyes">
   <g class="pupille">
    <g class="palp">
     <ellipse cx="432" cy="420" rx="13" ry="15" fill="#fff"/>
     <circle cx="434" cy="423" r="6.5" fill="#1C1C1C"/>
     <circle cx="436.5" cy="420.5" r="2.2" fill="#fff"/>
    </g>
    <g class="palp" style="animation-delay:2.75s">
     <ellipse cx="468" cy="420" rx="13" ry="15" fill="#fff"/>
     <circle cx="470" cy="423" r="6.5" fill="#1C1C1C"/>
     <circle cx="472.5" cy="420.5" r="2.2" fill="#fff"/>
    </g>
   </g>
  </g>
  <!-- cornice in ottone -->
  <circle cx="450" cy="420" r="44" fill="none" stroke="#c9a22e" stroke-width="8"/>
  <circle cx="450" cy="420" r="49" fill="none" stroke="#8a6f1f" stroke-width="2.5"/>
  <!-- lo sportellino che si apre -->
  <g class="hatch">
   <circle cx="450" cy="420" r="41" fill="#b3922a"/>
   <circle cx="450" cy="420" r="41" fill="none" stroke="#8a6f1f" stroke-width="3"/>
   <line x1="428" y1="420" x2="472" y2="420" stroke="#8a6f1f" stroke-width="3"/>
   <circle cx="450" cy="420" r="4.5" fill="#7a6114"/>
  </g>
  <circle cx="414" cy="420" r="5" fill="#7a6114"/>
 </g>

 <!-- targa -->
 <g>
  <rect x="384" y="588" width="132" height="24" rx="6" fill="#2e2a26"/>
  <text x="450" y="605" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ddc8" letter-spacing="2">POI•LOVE MEDIA</text>
 </g>
</svg>
</div>

<div class="txt">
 <h1 id="t1"></h1>
 <p id="t2"></p>
 <a class="btn" href="https://poilove.com" id="t3"></a>
</div>

<script>
const T={
 sq:{t1:'Këtu ruhen fotografitë e <b>POI•LOVE</b>.',
     t2:'Porta është e mbyllur, por ILLI bën rojë: çdo kujtim është i sigurt, mes maleve.',
     t3:'Shko te aplikacioni'},
 it:{t1:'Qui vivono le fotografie di <b>POI•LOVE</b>.',
     t2:'Il portone è chiuso, ma ILLI fa la guardia: ogni ricordo è al sicuro, in mezzo alle montagne.',
     t3:'Vai all\'app'},
 en:{t1:'This is where the photos of <b>POI•LOVE</b> live.',
     t2:'The gate is locked, but ILLI keeps watch: every memory is safe, up in the mountains.',
     t3:'Go to the app'}};
const n=(navigator.language||'en').slice(0,2).toLowerCase();
const d=T[n==='sq'?'sq':n==='it'?'it':'en'];
document.documentElement.lang=n==='sq'?'sq':n==='it'?'it':'en';
t1.innerHTML=d.t1; t2.textContent=d.t2; t3.textContent=d.t3;
</script>
</body>
</html>
