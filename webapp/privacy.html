<script type="text/plain" id="md-it"># Informativa sulla privacy di POI•LOVE

*Ultimo aggiornamento: 21/08/2026*

> Questa informativa l'abbiamo scritta noi, non un modello comprato. È in vigore così com'è. Se qualcosa non ti torna, scrivici: la correggiamo.

POI•LOVE è la mappa comunitaria dei luoghi amati: uno spazio dove le persone segnano, raccontano e condividono i posti a cui tengono. Per farlo funzionare trattiamo alcuni tuoi dati personali. Questa informativa ti spiega, in modo onesto e leggibile, quali dati raccogliamo, perché, su quale base giuridica, con chi li condividiamo, per quanto li conserviamo e quali diritti hai.

POI•LOVE viene lanciata pubblicamente in Albania ed è soggetta alla legge albanese n. 124/2024 sulla protezione dei dati personali, allineata al Regolamento UE 2016/679 (GDPR). Se sei un utente nell'Unione Europea, ti si applica anche il GDPR. Trattiamo i tuoi dati nel rispetto di entrambi.

---

## 1. Chi tratta i tuoi dati (titolare e contatti)

Il titolare del trattamento è:

**Alessandro Castagna, 321.AL / EVOLAB**
Contatto per qualsiasi questione relativa ai dati e per esercitare i tuoi diritti: **it@altrostile.app**

Per ogni domanda, richiesta o reclamo sulla privacy puoi scriverci a questo indirizzo. Rispondiamo entro i tempi previsti dalla legge (vedi sezione 8).

Nota di trasparenza: stiamo valutando la nomina di un Responsabile della protezione dei dati (DPO) e di un rappresentante in Albania, come richiesto dalla legge n. 124/2024 per i trattamenti su larga scala. Appena nominati, i loro recapiti saranno pubblicati qui e comunicati all'Autorità.

---

## 2. Quali dati raccogliamo e perché

Raccogliamo solo i dati che servono a far funzionare l'app. Ecco l'elenco completo, categoria per categoria.

### 2.1 Dati di registrazione e account
- **Email** e, in caso di registrazione classica, **password** (conservata solo in forma cifrata, non in chiaro).
- Se ti registri tramite un provider esterno (**Google, Facebook, Apple, X (Twitter) o LinkedIn**), riceviamo dal provider che scegli: email, nome o handle, immagine del profilo. Se non compili un username, ne generiamo uno di default partendo dalla parte iniziale della tua email (la parte prima della @): puoi cambiarlo in qualsiasi momento dal profilo.

*Perché:* per creare il tuo account, autenticarti, permetterti di recuperare l'accesso e gestire il servizio. Senza questi dati non possiamo darti un account.

### 2.2 Dati del profilo pubblico
- **Username** (obbligatorio), **nome visualizzato**, **avatar**, **bio**, **lingua preferita**.

*Perché:* per identificarti pubblicamente nell'app, mostrare il tuo profilo agli altri utenti, permetterti di avere un indirizzo personale (@username). Nome, avatar e bio sono facoltativi: decidi tu cosa mostrare.

### 2.3 Posizione geografica (GPS)
- **Coordinate** (latitudine e longitudine) quando attivi la geolocalizzazione, più eventuale indirizzo, città e Paese ricavati da quelle coordinate.

*Perché:* per mostrarti i luoghi vicino a te, permetterti di creare un POI nel punto esatto in cui ti trovi, far funzionare la ricerca "vicino a me" e la navigazione verso un luogo.

La posizione è uno dei dati più delicati che trattiamo, perché può rivelare le tue abitudini. Per questo:
- la attiviamo **solo quando serve** (quando crei o cerchi un POI, o navighi), non in sottofondo di continuo;
- ti chiediamo sempre il permesso tramite il browser o il dispositivo;
- puoi negarla o revocarla in qualsiasi momento dalle impostazioni del browser o del dispositivo, e dalle impostazioni dell'app.

### 2.4 Foto che carichi
- **Foto dei luoghi (POI)** e **foto del profilo** che decidi di caricare.

*Perché:* per documentare e illustrare i luoghi, e per personalizzare il tuo profilo.

Leggi con attenzione la **sezione 4** su consenso e foto: le foto possono ritrarre persone, e qui ci sono regole e responsabilità precise.

Le foto che carichi vengono elaborate e archiviate tramite il nostro media server media.poilove.com (vedi sezione 5). Per ridurre i rischi, quando carichi una foto **rimuoviamo i metadati EXIF** (che includono GPS preciso, data, modello del dispositivo) prima di pubblicarla. Se usi una foto per creare un POI, possiamo leggere la posizione GPS contenuta nei suoi metadati al solo scopo di proporre il punto sulla mappa: quel dato non viene ripubblicato con la foto.

### 2.5 Contenuti che crei
- **POI** (luoghi che salvi), **"love" e preferiti**, **liste**, **itinerari di viaggio** con relative tappe, **compagnie di viaggio** (gruppi con altri utenti), relazioni di **follow** (chi segui e chi ti segue).

*Perché:* sono il cuore dell'app. Servono a costruire la tua mappa, condividere i luoghi, organizzare viaggi e seguire altre persone.

**Tag liberi sui POI.** Quando crei un POI puoi aggiungere tag testuali liberi (fino a 10). I tag dei POI pubblici sono visibili a tutta la comunità e vengono usati come suggerimenti di completamento automatico anche per chi non ha effettuato l'accesso. Non inserire nei tag dati personali tuoi o di altri.

**Segnalazione di una categoria mancante.** Se segnali che manca una categoria, registriamo il termine cercato insieme al tuo identificativo utente, per aggiornare e curare le categorie della piattaforma.

**Cessione e reclamo di un POI.** Se cedi un POI tramite codice o richiedi la proprietà di un luogo, trattiamo l'identità di chi cede e di chi riceve (identificativi e nome pubblico) ed eventuali messaggi di testo libero che scrivi nella richiesta: questi dati sono visibili all'amministrazione per gestire e validare l'operazione.

Alcuni di questi contenuti possono includere dati di **altre persone** (ad esempio i membri di una compagnia di viaggio, o l'email di chi inviti). Vedi la sezione 4.4.

### 2.6 Inviti e compagnie
- Quando inviti qualcuno a una compagnia di viaggio, trattiamo l'**email del destinatario** e un **codice di invito** per recapitargli il link.

*Perché:* per consentirti di invitare altre persone. L'invitato può accettare o ignorare. Inviamo un solo invito, con la possibilità di non ricevere altri messaggi.

### 2.7 Gamification e referral
- **Punti**, eventi che li generano (ad esempio creare un POI, dare un "love", condividere), **referral** (inviti che portano a nuove iscrizioni).

*Perché:* per far funzionare il sistema a punti, riconoscere i tuoi contributi e prevenire abusi e frodi. Registriamo solo le azioni che generano punti, non ogni singolo clic.

### 2.8 Segnalazioni e moderazione
- Quando **segnali** un contenuto o un profilo, registriamo la **segnalazione** (cosa hai segnalato, il motivo, la data) e chi l'ha inviata.
- Quando interveniamo a fini di moderazione, registriamo le **azioni di moderazione** (ad esempio sospensione, blocco, rimozione di un contenuto) e il loro motivo.

*Perché:* per mantenere la piattaforma sicura, gestire le segnalazioni, proteggere gli utenti e adempiere agli obblighi di legge. Conserviamo questi dati anche come prova in caso di abusi o contestazioni.

### 2.9 Messaggi di assistenza e comunicazioni dal team
- Per assisterti e informarti, un **amministratore o moderatore** può inviarti **messaggi diretti** che compaiono nella tua chat con ILLI•AI, chiaramente contrassegnati come scritti da una **persona del team** (etichetta "Umano") e distinti dalle risposte automatiche dell'assistente. Puoi **rispondere**: la conversazione (testo dei messaggi, data e ora, stato di lettura) è visibile **solo a te e al team**, mai ad altri utenti.

*Perché:* per fornirti assistenza, rispondere alle tue domande e comunicarti informazioni sul servizio (ad esempio novità, promozioni o eventuali vincite legate all'app). Base giuridica: **esecuzione del contratto** e nostro **legittimo interesse** a offrirti supporto. Non usiamo questi messaggi per profilazione pubblicitaria e puoi chiederci in ogni momento di interromperli.

### 2.10 Abbonamenti a pagamento
- Se attivi un **abbonamento** a uno dei tier a pagamento (**Professionista, Professionista Plus, Sostenitore, Mecenate**, ed eventuali profili dedicati come **Influencer**), trattiamo i dati necessari a gestirlo: tier scelto, stato dell'abbonamento, data di attivazione e di rinnovo o cessazione, e i vantaggi collegati.
- I **dati di pagamento** veri e propri (ad esempio i dati della carta) sono trattati direttamente dal fornitore di pagamento che useremo al momento dell'attivazione, secondo la sua informativa: noi non conserviamo i numeri di carta.

*Perché:* per attivare e gestire l'abbonamento, riconoscerti i vantaggi del tier, emettere eventuali documenti contabili e adempiere agli obblighi fiscali e di legge.

### 2.11 Cosa NON salviamo
- La **cronologia delle ricerche** di indirizzi non viene conservata nel nostro database: resta nella sessione.
- La **dettatura vocale**, se la usi, viene convertita in testo dal tuo dispositivo o browser: **non registriamo né conserviamo l'audio**.

## 3. Basi giuridiche del trattamento

Ogni trattamento ha una base giuridica precisa (art. 13 legge 124/2024, art. 6 GDPR):

| Dato | Base giuridica |
|------|----------------|
| Email, password, dati di login | **Esecuzione del contratto**: senza, non possiamo darti il servizio |
| Username, nome, avatar, bio | **Esecuzione del contratto** e nostro **legittimo interesse** a gestire la piattaforma e prevenire abusi |
| Posizione GPS | **Consenso esplicito**, che puoi revocare in ogni momento |
| Foto che carichi | **Consenso esplicito** al caricamento; per foto che ritraggono persone vedi sezione 4 |
| Contenuti (POI, liste, itinerari, follow, compagnie) | **Esecuzione del contratto** |
| Email di invito a compagnie | **Consenso** tuo all'invio e tua dichiarazione di avere il consenso del destinatario |
| Punti, eventi, referral | **Legittimo interesse** a far funzionare la gamification e a prevenire frodi |
| Messaggi all'assistente AI (ILLI e copilota amministrativo) | **Esecuzione del contratto** per fornirti la funzione che hai richiesto, e nostro **legittimo interesse** a far funzionare e migliorare l'assistente |
| Segnalazioni e azioni di moderazione | **Legittimo interesse** alla sicurezza della piattaforma e degli utenti, e **obbligo legale** quando dobbiamo conservarle o agire |
| Dati di gestione dell'abbonamento a pagamento | **Esecuzione del contratto** di abbonamento e **obbligo legale** per gli adempimenti contabili e fiscali |
| Statistiche aggregate di utilizzo | **Legittimo interesse**, in forma anonima o pseudonimizzata |

In sintesi, le basi giuridiche su cui ci appoggiamo sono il **consenso** (per geolocalizzazione, foto e inviti), l'**esecuzione del contratto** (per account, contenuti, assistente AI e abbonamenti), il **legittimo interesse** (per sicurezza, prevenzione di abusi e frodi, gamification e statistiche aggregate) e l'**obbligo legale** (per moderazione, contabilità e fisco quando previsto dalla legge).

Quando la base è il **consenso** o il **legittimo interesse**, hai sempre il diritto di revocare il consenso o di opporti (vedi sezione 8).

---

## 4. Consenso, geolocalizzazione e foto: leggi qui

Questa è la sezione più importante per la tua tutela e per quella delle altre persone.

### 4.1 Come funziona il consenso
Il consenso che ti chiediamo è **libero, informato, specifico e inequivocabile**: lo dai con un'azione chiara (ad esempio attivando una funzione o spuntando una casella), mai con caselle già spuntate o per silenzio. Chiediamo consensi **separati** per cose diverse: uno per la geolocalizzazione, uno per il caricamento delle foto. Puoi accettarne uno e non l'altro.

Puoi **revocare il consenso in qualsiasi momento**, ed è facile come darlo: dalle impostazioni dell'app, del browser o del dispositivo. La revoca vale per il futuro e non rende illecito ciò che abbiamo trattato prima, legittimamente, mentre il consenso era attivo.

### 4.2 Geolocalizzazione
Attiviamo il GPS solo quando ti serve una funzione che lo richiede, e te lo segnaliamo. Quando chiudi quella funzione, smettiamo di usarlo. Se decidi di rendere pubblica una lista o una compagnia, ricorda che la posizione collegata può diventare visibile ad altri: valuta bene cosa condividi.

### 4.3 Foto: cosa puoi e cosa NON devi caricare
Le foto che carichi su un POI sono, per loro natura, destinate a essere **viste da altri utenti**. Prima di caricare una foto, leggi queste regole. Caricando una foto, dichiari di rispettarle e te ne assumi la responsabilità.

**Cosa NON devi caricare:**
- Foto che ritraggono **persone riconoscibili** (volti identificabili) **senza il loro consenso**. Questo vale anche per le persone sullo sfondo, non solo per il soggetto principale.
- Foto di **minori** senza il consenso di chi ne ha la responsabilità genitoriale.
- Foto che permettano di **riconoscere o identificare in modo univoco** una persona dal volto (dati biometrici): questo tipo di trattamento è vietato senza un consenso esplicito e specifico della persona interessata.
- Foto che violano la **privacy, la dignità o i diritti** di qualcuno, contenuti illeciti, offensivi, sessualmente espliciti, o di cui non possiedi i diritti.
- Documenti, targhe, dati sanitari o altre informazioni sensibili di terzi.

**Cosa ti consigliamo:**
- Preferisci foto del **luogo senza persone riconoscibili**: sono le più sicure per tutti.
- Se ci sono persone, assicurati di avere il loro consenso, oppure rendi i volti non riconoscibili.

**La tua responsabilità.** Quando carichi una foto che ritrae altre persone, rispetto a quelle persone agisci tu come responsabile della raccolta del loro consenso. POI•LOVE mette a disposizione lo strumento, ma la scelta di cosa caricare è tua. Se ricevi una segnalazione o una richiesta legittima, rimuoviamo prontamente i contenuti problematici (vedi sezione 8 per le segnalazioni).

### 4.4 Dati di altre persone nei tuoi contenuti
Quando inviti qualcuno a una compagnia di viaggio o inserisci altre persone nei tuoi contenuti, ci fornisci dati che riguardano loro (ad esempio un'email). Devi farlo solo se hai una base legittima per condividerli, e dichiari di averla. Chi viene invitato può sempre rifiutare e chiedere la rimozione dei propri dati.

### 4.5 Visibilità e impostazioni predefinite
Lavoriamo perché le impostazioni più prudenti siano quelle predefinite (ad esempio compagnie private per impostazione iniziale, e grafo dei follow non liberamente esplorabile da chiunque). Quando scegli di rendere qualcosa pubblico, te lo segnaliamo.

---

## 5. Con chi condividiamo i dati (servizi terzi e destinatari)

Per far funzionare POI•LOVE ci appoggiamo ad alcuni fornitori esterni, che trattano i dati come nostri responsabili (sub-responsabili) o come destinatari autonomi. La legge n. 124/2024 e il GDPR ci impongono di essere trasparenti su chi sono, su cosa ricevono e su dove vengono trattati i dati. Ecco l'elenco completo.

| Fornitore | Cosa riceve | A cosa serve | Dove |
|-----------|-------------|--------------|------|
| **La nostra macchina** (srv.poilove.com, Hetzner) | Il database intero: profili, luoghi, contenuti, punti, abbonamenti, segnalazioni. E gli accessi: email e password cifrata, sessioni | È il cuore del servizio, e da agosto 2026 è **nostro**: non è più affidato a un fornitore esterno | **Germania**, Unione Europea |
| **Supabase** | Restano fuori solo sei programmi di servizio (l'assistente ILLI, la moderazione delle recensioni, la ricerca immagini, l'invio email, le trascrizioni, l'arricchimento dei luoghi) e le foto caricate prima di agosto 2026 | Programmi che girano ancora fuori casa e si trasferiranno più avanti | Unione Europea, con possibili componenti negli **Stati Uniti** |
| **Google (login OAuth)** | Email, nome, avatar del tuo account Google | Accesso con Google | **Stati Uniti** |
| **Google (Google Places API)** | Il testo della ricerca di un luogo e le coordinate della zona | Ottenere informazioni reali sui posti: nome, valutazioni, tipo di luogo | **Stati Uniti** (e altri server Google fuori dall'UE), con garanzie adeguate |
| **X (Twitter)** e **LinkedIn** (login OAuth) | Email, nome/handle, avatar | Accesso con il tuo account | **Stati Uniti** |
| **OpenAI** | I **messaggi** che invii all'assistente AI **ILLI** e al **copilota amministrativo**, che possono includere la città o la zona di cui parli | Elaborare le risposte dell'assistente AI | **Stati Uniti**, con garanzie adeguate |
| **Anthropic** | I **messaggi** che invii all'assistente AI **ILLI** e al **copilota amministrativo**, che possono includere la città o la zona di cui parli | Elaborare le risposte dell'assistente AI | **Stati Uniti**, con garanzie adeguate |
| **OpenStreetMap / Nominatim / Overpass** | Coordinate e testo dell'indirizzo cercato, incluse le coordinate live quando cerchi luoghi reali vicino a te | Ricerca luoghi, conversione tra indirizzi e coordinate, elenco dei posti reali vicini | Server in **Europa** |
| **media.poilove.com** (nostro media server) | Le foto che carichi (POI e avatar) e un token che identifica la tua sessione | Archiviare e servire le foto dei luoghi e del profilo | **Germania** (server del progetto) |
| **api.qrserver.com** (goQR) | L'indirizzo pubblico del tuo profilo (che contiene il tuo username) | Generare il codice QR del profilo | Estero |
| **ui-avatars.com** | Le iniziali o il nome che compaiono nel tuo profilo | Generare un avatar segnaposto | Estero |
| **image.pollinations.ai** | Il testo che scrivi per generare un'immagine o un avatar con l'AI | Generazione di immagini con AI su tua richiesta | Estero |
| **Tile mappa (OpenStreetMap, ESRI ArcGIS) e CDN/font (jsDelivr, unpkg, Google Fonts)** | La zona della mappa che stai guardando, e in generale il tuo indirizzo IP e il tipo di dispositivo | Mostrare le mappe e caricare librerie e font | UE / USA |
| **App di navigazione (Google Maps, Waze, Apple Maps)** | Le coordinate del luogo verso cui chiedi indicazioni | Aprire la navigazione stradale su tua richiesta | USA |

A seconda della funzione e della configurazione, i messaggi inviati all'assistente AI possono essere elaborati da **OpenAI** oppure da **Anthropic**. La funzione lente, che mostra i luoghi reali vicini, invia le tue coordinate live a Google Places anche quando non hai effettuato l'accesso: usala solo se accetti questo invio. Il copilota amministrativo (Anthropic) può ricevere, lato amministrazione, campioni di dati reali della piattaforma (ad esempio username, tier, stato di moderazione) per assistere la gestione. In entrambi i casi i server sono negli **Stati Uniti** e il trattamento avviene secondo l'informativa del fornitore. **Non inserire dati sensibili o riservati** (ad esempio dati su salute, dati di altre persone, password o documenti) nelle chat con l'assistente AI.

Non vendiamo i tuoi dati e non li cediamo a terzi per finalità pubblicitarie.

Con i fornitori che trattano dati per nostro conto stipuliamo, dove previsto, accordi sul trattamento dei dati (DPA), e teniamo aggiornato un registro dei trattamenti e dei destinatari, come richiesto dalla legge.

### 5.1 Trasferimenti fuori dall'Albania e dall'Unione Europea
Alcuni fornitori (in particolare **OpenAI**, **Anthropic** e **Google**) hanno server negli **Stati Uniti**, e anche **Supabase** può avere componenti negli Stati Uniti. Inviare i tuoi dati lì costituisce un trasferimento verso un Paese terzo, che gli Stati Uniti, in generale, non sono considerati adeguati né dall'Albania né dall'UE.

Per rendere lecito questo trasferimento ci basiamo, a seconda dei casi, su:
- **garanzie contrattuali adeguate** (ad esempio clausole tipo di protezione dei dati) offerte da questi fornitori, e, dove richiesto dalla normativa albanese, sull'**autorizzazione preventiva dell'Autorità (Commissario)**;
- in mancanza di tali garanzie, il tuo **consenso esplicito e informato sui rischi** del trasferimento, ad esempio quando scegli di usare l'assistente ILLI o la ricerca di luoghi che richiedono questi servizi.

Trasferire dati negli Stati Uniti comporta che autorità di quel Paese possano, in certi casi, accedervi con tutele diverse da quelle europee e albanesi. Cerchiamo di **minimizzare** i dati inviati: ad esempio all'assistente AI (OpenAI o Anthropic) arrivano i tuoi messaggi e la zona di cui parli, non il tuo nome o il tuo account; e a Google Places arrivano il testo della ricerca e la zona, non la tua identità. Se non vuoi che certi dati lascino l'area UE/Albania, puoi evitare di usare le funzioni che si appoggiano a questi fornitori (assistente ILLI, copilota amministrativo, ricerca tramite Google Places). E in ogni caso, come ricordato sopra, non inserire dati sensibili nelle chat con l'assistente AI.

Fino ad agosto 2026 il database, gli accessi e le foto stavano su Supabase, un fornitore esterno. Dal 18 agosto 2026 **stanno su una macchina nostra in Germania**: i tuoi dati non passano più per le mani di un fornitore terzo per essere semplicemente conservati. Fuori casa restano solo sei programmi di servizio, elencati nella tabella sopra, e le foto caricate prima di quella data.

## 5bis. Trattamenti aggiunti dopo luglio 2026

Da luglio 2026 il servizio fa alcune cose in più. Le elenchiamo qui perché riguardano i tuoi dati.

**I volti nelle foto.** Quando carichi la foto di un luogo, un programma sulla nostra macchina cerca i volti e li sfoca automaticamente, con bordi sfumati. Serve a proteggere le persone finite nell'inquadratura per caso, che non ti hanno dato nessun consenso. Se il programma non riesce a fare il suo lavoro, **la foto non viene pubblicata**: preferiamo perdere una foto che pubblicare il volto di un estraneo. Dal pannello di amministrazione si può scegliere se sfocare i volti di tutti o solo quelli dei bambini. Le foto arrivano sfocate sul server: l'originale con i volti in chiaro non viene conservato.

**Le recensioni.** Puoi scrivere una recensione sul luogo di una persona con cui sei in contatto. Prima di comparire, il testo viene letto da un programma di intelligenza artificiale che controlla se rispetta le regole scritte nel pannello (niente insulti, niente dati di altre persone, niente pubblicità). Il testo della recensione viene quindi inviato a OpenAI o Anthropic, come per l'assistente ILLI. Se il programma non è sicuro, la recensione resta in attesa e la guarda una persona.

**I dati del locale.** Se sei un'attività, puoi pubblicare orari, menu, telefono, modi di pagamento. Sono dati che decidi tu di rendere pubblici. Contiamo anche quante volte la tua scheda viene aperta e quante volte il tuo codice QR viene inquadrato: sono numeri che vedi solo tu, e non sono legati all'identità di chi guarda.

**La voce e il video.** Puoi registrare la tua voce su un luogo e caricare un video. Restano sulla nostra macchina in Germania. La voce nelle compagnie di viaggio viene anche trascritta in testo, e per farlo il file audio viene inviato a OpenAI.

**Gli abbonamenti.** Se hai un livello a pagamento teniamo la data di scadenza, il riferimento del pagamento che ci comunichi e lo storico dei rinnovi. Non trattiamo dati della tua carta: il pagamento avviene fuori dalla piattaforma.

**Le segnalazioni.** Chiunque può segnalare un contenuto. La segnalazione conserva chi l'ha fatta, cosa riguarda e il motivo, e viene guardata entro ventiquattro ore.

**L'email.** Le email di servizio (link di accesso, avvisi) partono tramite **AcumbaMail**, che riceve il tuo indirizzo e il contenuto del messaggio. I server sono in **Spagna**, Unione Europea.

## 7. Come proteggiamo i tuoi dati (sicurezza)

Adottiamo misure tecniche e organizzative per proteggere i tuoi dati, tra cui:
- **Row Level Security (RLS)** sul database: ogni utente può accedere solo ai dati a cui ha diritto.
- **Chiavi API tenute lato server**, dietro funzioni protette (Edge Function): non viaggiano mai nel browser e non sono esposte agli utenti.
- **HTTPS** su tutte le connessioni: i dati viaggiano cifrati.
- **File interni del progetto bloccati** dalla parte pubblica del sito, così non sono raggiungibili dall'esterno.
- **Password cifrate** e gestione dell'autenticazione tramite un fornitore specializzato.
- **Rimozione dei metadati EXIF** dalle foto prima della pubblicazione.

Nessun sistema è sicuro al 100%. Se si verificasse una violazione dei dati con rischio per i tuoi diritti, lo notificheremo all'Autorità (Commissario) entro **72 ore** e, nei casi a rischio elevato, anche a te senza ingiustificato ritardo, come prevede la legge.

*Pse:* për të aktivizuar e menaxhuar abonimin, për të të njohur përfitimet e nivelit, për të nxjerrë dokumentet kontabël dhe për të përmbushur detyrimet tatimore e ligjore.

- **Historiku i kërkimeve** të adresave nuk ruhet në bazën tonë të të dhënave: mbetet brenda sesionit.
- **Diktimi me zë**, nëse e përdor, kthehet në tekst nga pajisja ose shfletuesi yt: **nuk e regjistrojmë dhe nuk e ruajmë audion**.

| Mesazhet për asistentin AI (ILLI dhe kopiloti i administrimit) | **Zbatimi i kontratës** për të të dhënë funksionin që kërkove, dhe **interesi ynë legjitim** për ta bërë të punojë e për ta përmirësuar asistentin |
| Raportimet dhe veprimet e moderimit | **Interes legjitim** për sigurinë e platformës dhe të përdoruesve, dhe **detyrim ligjor** kur duhet t'i ruajmë ose të veprojmë |
| Të dhënat e menaxhimit të abonimit | **Zbatimi i kontratës** së abonimit dhe **detyrim ligjor** për detyrimet kontabël e tatimore |
| Statistikat e përmbledhura të përdorimit | **Interes legjitim**, në formë anonime ose me pseudonim |

Shkurt, bazat mbi të cilat mbështetemi janë **pëlqimi** (për vendndodhjen, fotot dhe ftesat), **zbatimi i kontratës** (për llogarinë, përmbajtjen, asistentin AI dhe abonimet), **interesi legjitim** (për sigurinë, parandalimin e abuzimeve e mashtrimeve, pikët dhe statistikat e përmbledhura) dhe **detyrimi ligjor** (për moderimin, kontabilitetin e tatimet kur e kërkon ligji).

Kur baza është **pëlqimi** ose **interesi legjitim**, ke gjithmonë të drejtën ta tërheqësh pëlqimin ose të kundërshtosh (shih pikën 8).

## 4. Pëlqimi, vendndodhja dhe fotot: lexo këtu

Kjo është pika më e rëndësishme për mbrojtjen tënde dhe të personave të tjerë.

### 4.1 Si funksionon pëlqimi
Pëlqimi që të kërkojmë është **i lirë, i informuar, i posaçëm dhe i qartë**: e jep me një veprim të dukshëm (për shembull duke ndezur një funksion ose duke shënuar një kuti), kurrë me kuti të shënuara paraprakisht dhe kurrë me heshtje. Kërkojmë pëlqime **të ndara** për gjëra të ndryshme: një për vendndodhjen, një për ngarkimin e fotove. Mund të pranosh njërin dhe jo tjetrin.

Mund **ta tërheqësh pëlqimin në çdo kohë**, dhe është po aq e lehtë sa ta japësh: nga cilësimet e aplikacionit, të shfletuesit ose të pajisjes. Tërheqja vlen për të ardhmen dhe nuk e bën të paligjshëm atë që kemi përpunuar më parë, ligjshëm, sa ishte pëlqimi në fuqi.

### 4.2 Vendndodhja
E ndezim GPS-in vetëm kur të duhet një funksion që e kërkon, dhe ta themi. Kur e mbyll atë funksion, ndalojmë ta përdorim. Nëse vendos ta bësh publike një listë ose një shoqëri, mbaj mend se vendndodhja e lidhur mund të bëhet e dukshme për të tjerët: mendo mirë çfarë ndan.

### 4.3 Fotot: çfarë mund dhe çfarë NUK duhet të ngarkosh
Fotot që ngarkon mbi një POI janë, nga natyra e tyre, të destinuara **t'i shohin të tjerët**. Para se të ngarkosh një foto, lexo këto rregulla. Duke ngarkuar një foto, deklaron se i respekton dhe merr përgjegjësinë.

**Çfarë NUK duhet të ngarkosh:**
- Foto që paraqesin **persona të njohshëm** (fytyra të identifikueshme) **pa pëlqimin e tyre**. Kjo vlen edhe për njerëzit në sfond, jo vetëm për subjektin kryesor.
- Foto të **të miturve** pa pëlqimin e atij që ushtron përgjegjësinë prindërore.
- Foto që lejojnë **njohjen ose identifikimin e vetëm** të një personi nga fytyra (të dhëna biometrike): ky lloj përpunimi është i ndaluar pa një pëlqim të shprehur e të posaçëm të personit.
- Foto që cenojnë **privatësinë, dinjitetin ose të drejtat** e dikujt, përmbajtje të paligjshme, fyese, seksualisht të hapura, ose për të cilat nuk ke të drejta.
- Dokumente, targa, të dhëna shëndetësore ose informacione të tjera të ndjeshme të të tretëve.

**Çfarë të këshillojmë:**
- Parapëlqe foto të **vendit pa njerëz të njohshëm**: janë më të sigurtat për të gjithë.
- Nëse ka njerëz, sigurohu që ke pëlqimin e tyre, ose bëji fytyrat të panjohshme.

**Përgjegjësia jote.** Kur ngarkon një foto që paraqet persona të tjerë, ndaj atyre personave je ti përgjegjës për marrjen e pëlqimit. POI•LOVE vë në dispozicion mjetin, por zgjedhja se çfarë ngarkon është e jotja. Nëse marrim një raportim ose një kërkesë të ligjshme, e heqim menjëherë përmbajtjen problematike (shih pikën 8 për raportimet).

### 4.4 Të dhënat e personave të tjerë brenda përmbajtjes sate
Kur fton dikë në një shoqëri udhëtimi ose fut persona të tjerë në përmbajtjen tënde, na jep të dhëna që i përkasin atyre (për shembull një email). Duhet ta bësh vetëm nëse ke një bazë të ligjshme për t'i ndarë, dhe deklaron se e ke. Kush ftohet mund gjithmonë të refuzojë dhe të kërkojë heqjen e të dhënave të veta.

### 4.5 Dukshmëria dhe cilësimet paraprake
Punojmë që cilësimet më të kujdesshme të jenë ato paraprake (për shembull shoqëritë private në nisje, dhe rrjeti i ndjekjeve jo i shfletueshëm lirisht nga kushdo). Kur zgjedh ta bësh diçka publike, ta themi.

## 5. Me kë i ndajmë të dhënat (shërbime të treta dhe marrës)

Për ta bërë POI•LOVE të punojë mbështetemi te disa ofrues të jashtëm, që i përpunojnë të dhënat si përpunues në emrin tonë ose si marrës të pavarur. Ligji nr. 124/2024 dhe GDPR na detyrojnë të jemi transparentë se kush janë, çfarë marrin dhe ku përpunohen të dhënat. Ja lista e plotë.

| **Supabase** | Jashtë mbeten vetëm gjashtë programe shërbimi (asistenti ILLI, moderimi i vlerësimeve, kërkimi i imazheve, dërgimi i email-eve, transkriptimet, pasurimi i vendeve) dhe fotot e ngarkuara para gushtit 2026 | Programe që ende punojnë jashtë shtëpisë dhe do të zhvendosen më vonë | Bashkimi Evropian, me pjesë të mundshme në **Shtetet e Bashkuara** |

Sipas funksionit dhe konfigurimit, mesazhet e dërguara asistentit AI mund të përpunohen nga **OpenAI** ose nga **Anthropic**. Funksioni i lentes, që tregon vendet e vërteta afër, ua dërgon koordinatat e tua të çastit Google Places edhe kur nuk ke hyrë: përdore vetëm nëse e pranon këtë. Kopiloti i administrimit (Anthropic) mund të marrë, nga ana e administrimit, mostra të dhënash të vërteta të platformës (për shembull emrin e përdoruesit, nivelin, gjendjen e moderimit) për të ndihmuar menaxhimin. Në të dyja rastet serverët janë në **Shtetet e Bashkuara** dhe përpunimi bëhet sipas njoftimit të ofruesit. **Mos vendos të dhëna të ndjeshme ose konfidenciale** (për shembull të dhëna shëndetësore, të dhëna të personave të tjerë, fjalëkalime ose dokumente) në bisedat me asistentin AI.

Nuk i shesim të dhënat e tua dhe nuk ua japim të tretëve për qëllime reklamash.

Me ofruesit që përpunojnë të dhëna në emrin tonë lidhim, aty ku parashikohet, marrëveshje për përpunimin e të dhënave (DPA), dhe mbajmë të përditësuar një regjistër të përpunimeve dhe të marrësve, siç kërkon ligji.

### 5.1 Transferimet jashtë Shqipërisë dhe Bashkimit Evropian
Disa ofrues (veçanërisht **OpenAI**, **Anthropic** dhe **Google**) kanë serverë në **Shtetet e Bashkuara**, dhe edhe **Supabase** mund të ketë pjesë atje. Dërgimi i të dhënave të tua atje përbën një transferim drejt një vendi të tretë, ndërsa Shtetet e Bashkuara, në përgjithësi, nuk konsiderohen të përshtatshme as nga Shqipëria as nga BE-ja.

Për ta bërë të ligjshëm këtë transferim mbështetemi, sipas rastit, në:
- **garanci kontraktore të përshtatshme** (për shembull klauzola standarde për mbrojtjen e të dhënave) të ofruara nga këta ofrues, dhe, aty ku e kërkon legjislacioni shqiptar, në **autorizimin paraprak të Autoritetit (Komisionerit)**;
- në mungesë të këtyre garancive, në **pëlqimin tënd të shprehur dhe të informuar mbi rreziqet** e transferimit, për shembull kur zgjedh të përdorësh asistentin ILLI ose kërkimin e vendeve që i kërkojnë këto shërbime.

Transferimi i të dhënave në Shtetet e Bashkuara do të thotë se autoritetet e atij vendi mund, në raste të caktuara, të kenë qasje me mbrojtje të ndryshme nga ato evropiane e shqiptare. Përpiqemi t'i **pakësojmë** të dhënat e dërguara: për shembull te asistenti AI (OpenAI ose Anthropic) shkojnë mesazhet e tua dhe zona për të cilën flet, jo emri yt e as llogaria; dhe te Google Places shkojnë teksti i kërkimit dhe zona, jo identiteti yt. Nëse nuk dëshiron që disa të dhëna të dalin nga zona BE/Shqipëri, mund të mos i përdorësh funksionet që mbështeten te këta ofrues (asistenti ILLI, kopiloti i administrimit, kërkimi nëpërmjet Google Places). Dhe sidoqoftë, siç u tha më lart, mos vendos të dhëna të ndjeshme në bisedat me asistentin AI.

### 5.2 Çfarë ndryshoi në gusht 2026

Deri në gusht 2026 baza e të dhënave, hyrjet dhe fotot qëndronin te Supabase, një ofrues i jashtëm. Që nga 18 gushti 2026 qëndrojnë **në një makinë tonën në Gjermani**: të dhënat e tua nuk kalojnë më nëpër duart e një pale të tretë thjesht për t'u ruajtur. Jashtë mbeten vetëm gjashtë programe shërbimi, të listuara në tabelën më sipër, dhe fotot e ngarkuara para asaj date.

## 5bis. Përpunime të shtuara pas korrikut 2026

Që nga korriku 2026 shërbimi bën disa gjëra më shumë. I rendisim këtu sepse kanë të bëjnë me të dhënat e tua.

**Fytyrat në foto.** Kur ngarkon foton e një vendi, një program në makinën tonë kërkon fytyrat dhe i turbullon automatikisht, me buzë të zbutura. Shërben për të mbrojtur njerëzit që kanë përfunduar në kuadër rastësisht dhe nuk të kanë dhënë asnjë pëlqim. Nëse programi nuk ia del, **fotoja nuk publikohet**: preferojmë të humbasim një foto sesa të publikojmë fytyrën e një të panjohuri. Nga paneli i administrimit mund të zgjidhet nëse turbullohen fytyrat e të gjithëve apo vetëm ato të fëmijëve. Fotot mbërrijnë të turbulluara në server: origjinali me fytyrat e hapura nuk ruhet.

**Vlerësimet.** Mund të shkruash një vlerësim për vendin e një personi me të cilin je i lidhur. Para se të shfaqet, teksti lexohet nga një program inteligjence artificiale që kontrollon nëse respekton rregullat e shkruara në panel (pa fyerje, pa të dhëna të personave të tjerë, pa reklama). Teksti i vlerësimit i dërgohet pra OpenAI-t ose Anthropic-ut, si për asistentin ILLI. Nëse programi nuk është i sigurt, vlerësimi mbetet në pritje dhe e shikon një person.

**Të dhënat e lokalit.** Nëse je një biznes, mund të publikosh oraret, menynë, telefonin, mënyrat e pagesës. Janë të dhëna që ti vendos t'i bësh publike. Numërojmë edhe sa herë hapet skeda jote dhe sa herë skanohet kodi yt QR: janë numra që i sheh vetëm ti, dhe nuk lidhen me identitetin e atij që shikon.

**Zëri dhe videoja.** Mund të regjistrosh zërin tënd mbi një vend dhe të ngarkosh një video. Qëndrojnë në makinën tonë në Gjermani. Zëri në shoqëritë e udhëtimit transkriptohet edhe në tekst, dhe për këtë skedari i audios i dërgohet OpenAI-t.

**Abonimet.** Nëse ke një nivel me pagesë, mbajmë datën e skadimit, referencën e pagesës që na komunikon dhe historikun e rinovimeve. Nuk përpunojmë të dhënat e kartës sate: pagesa bëhet jashtë platformës.

**Raportimet.** Kushdo mund të raportojë një përmbajtje. Raportimi ruan kush e bëri, çfarë ka të bëjë dhe arsyen, dhe shihet brenda njëzet e katër orëve.

**Email-i.** Email-et e shërbimit (lidhjet e hyrjes, njoftimet) nisen nëpërmjet **AcumbaMail**, që merr adresën tënde dhe përmbajtjen e mesazhit. Serverët janë në **Spanjë**, Bashkimi Evropian.

| Vendndodhja GPS | Ruhet vetëm nëse e ruan brenda një përmbajtjeje (një POI, një ndalesë). Nuk mbajmë një historik të vazhdueshëm të lëvizjeve të tua |

Kur një e dhënë nuk është më e nevojshme për qëllimet për të cilat u mblodh, e fshijmë ose e bëjmë anonime. Disa të dhëna mund të ruhen më gjatë nëse duhet për të përmbushur detyrime ligjore ose për të mbrojtur një të drejtë në gjykatë.

## 7. Si i mbrojmë të dhënat e tua (siguria)

Marrim masa teknike dhe organizative për të mbrojtur të dhënat e tua, ndër to:
- **Rregulla sigurie rresht pas rreshti (RLS)** në bazën e të dhënave: secili mund të arrijë vetëm te të dhënat për të cilat ka të drejtë.
- **Çelësat API mbahen nga ana e serverit**, pas funksioneve të mbrojtura: nuk udhëtojnë kurrë në shfletues dhe nuk u ekspozohen përdoruesve.
- **HTTPS** në të gjitha lidhjet: të dhënat udhëtojnë të koduara.
- **Skedarët e brendshëm të projektit të bllokuar** nga ana publike e faqes, që të mos arrihen nga jashtë.
- **Fjalëkalime të koduara** dhe menaxhim i hyrjeve me programe të posaçme.
- **Heqja e të dhënave EXIF** nga fotot para publikimit.

Asnjë sistem nuk është 100% i sigurt. Nëse ndodh një shkelje e të dhënave me rrezik për të drejtat e tua, do t'ia njoftojmë Autoritetit (Komisionerit) brenda **72 orëve** dhe, në rastet me rrezik të lartë, edhe ty pa vonesë të pajustifikuar, siç parashikon ligji.

---

## 8. Të drejtat e tua dhe si i ushtron

Ke kontroll të plotë mbi të dhënat e tua. Sipas ligjit 124/2024 dhe GDPR mund:

- Të **kesh qasje** te të dhënat e tua dhe të marrësh një kopje (e para është falas).
- Të **korrigjosh** të dhëna të pasakta ose të paplota.
- Të **fshish** të dhënat e tua dhe **të mbyllësh llogarinë**: në cilësimet e profilit gjendet fshirja e llogarisë, që i fshin ose i bën anonime të dhënat e tua. Mund ta kërkosh edhe duke na shkruar.
- Të **kundërshtosh** një përpunim të bazuar në interesin legjitim, dhe në veçanti të kundërshtosh në mënyrë absolute çdo komunikim marketingu të drejtpërdrejtë.
- Të **kufizosh** përpunimin në raste të caktuara.
- **Transferueshmëri**: të marrësh të dhënat e tua në një format të strukturuar e të lexueshëm dhe, aty ku është teknikisht e mundur, t'i transferosh te të tjerët.
- Të **tërheqësh pëlqimin** në çdo kohë, për vendndodhjen, fotot ose çdo përpunim të bazuar në pëlqim.

Për t'i ushtruar këto të drejta, ose për të raportuar një foto a përmbajtje që të përket, shkruaj te **it@altrostile.app**. Përgjigjemi **brenda 30 ditëve** nga kërkesa. Përgjigjet janë falas; për kopje të mëtejshme mund të kërkojmë një kontribut të arsyeshëm për kostot.

Nuk i përdorim të dhënat e tua për të marrë **vendime vetëm të automatizuara** që prodhojnë efekte juridike mbi ty ose që të prekin ndjeshëm. Nëse kjo do të ndryshonte, do të të informojmë dhe do të të shpjegojmë logjikën e pasojat.

---

## 9. Të miturit

POI•LOVE nuk është menduar për fëmijë. Për ta përdorur, dhe për përpunimet e bazuara në pëlqim, duhet të kesh **të paktën 16 vjeç**. Nëse je nën 16 vjeç, mund ta përdorësh vetëm me pëlqimin e atij që ushtron përgjegjësinë prindërore.

Nuk mbledhim me vetëdije të dhëna të të miturve nën këtë prag pa pëlqimin e kërkuar. Nëse je prind ose kujdestar dhe mendon se një i mitur na ka dhënë të dhëna pa pëlqimin e duhur, na shkruaj te **it@altrostile.app**: do t'i heqim menjëherë ato të dhëna.

---

## 10. Ndryshimet e këtij njoftimi

Mund ta përditësojmë këtë njoftim, për shembull nëse shtojmë funksione ose ndryshojmë ofrues. Kur ndryshimi është i rëndësishëm, ta themi në aplikacion ose me email dhe përditësojmë datën lart. Të ftojmë ta rilexosh herë pas here. Përdorimi i vazhduar i aplikacionit pas një përditësimi vlen si njohje e versionit më të fundit.

Ky njoftim është i disponueshëm në **italisht, shqip dhe anglisht**. Në rast dyshimi interpretues, mbizotëron versioni që do të përdorim si referencë zyrtare në nisje.

---

## 11. Ankesa te Autoriteti

Nëse mendon se përpunimi i të dhënave të tua shkel ligjin, mund të paraqesësh gjithmonë një ankesë te autoriteti mbikëqyrës kompetent.

Në Shqipëri është **Komisioneri për të Drejtën e Informimit dhe Mbrojtjen e të Dhënave Personale (IDP)**, faqja **idp.al**.

> We wrote this policy ourselves, it is not a bought template. It is in force as it stands. If something does not look right to you, write to us: we will correct it.

POI•LOVE is the community map of beloved places: a space where people mark, tell and share the places they care about. To make that work we process some of your personal data. This policy explains, honestly and readably, what data we collect, why, on what legal basis, who we share it with, how long we keep it and what rights you have.

POI•LOVE launches publicly in Albania and is subject to Albanian law no. 124/2024 on the protection of personal data, aligned with EU Regulation 2016/679 (GDPR). If you are a user in the European Union, the GDPR also applies to you. We process your data in compliance with both.

---

## 1. Who processes your data (controller and contacts)

The data controller is:

**Alessandro Castagna, 321.AL / EVOLAB**
Contact for anything to do with data and for exercising your rights: **it@altrostile.app**

For any question, request or complaint about privacy you can write to that address. We answer within the times set by law (see section 8).

## 2. What data we collect and why

We collect only the data needed to run the app. Here is the complete list, category by category.

### 2.1 Registration and account data
- **Email** and, for classic registration, a **password** (kept only in encrypted form, never in the clear).
- If you register through an external provider (**Google, Facebook, Apple, X (Twitter) or LinkedIn**), we receive from the provider you choose: email, name or handle, profile picture. If you do not fill in a username, we generate a default one from the first part of your email (the part before the @): you can change it at any time from your profile.

*Why:* to create your account, sign you in, let you recover access and run the service. Without this data we cannot give you an account.

### 2.2 Public profile data
- **Username** (required), **display name**, **avatar**, **bio**, **preferred language**.

*Why:* to identify you publicly in the app, show your profile to other people, and give you a personal address (@username). Name, avatar and bio are optional: you decide what to show.

### 2.3 Location (GPS)
- **Coordinates** (latitude and longitude) when you turn location on, plus any address, city and country derived from those coordinates.

*Why:* to show you places near you, let you create a POI at the exact point where you are, and make "near me" search and navigation to a place work.

Location is one of the most delicate pieces of data we handle, because it can reveal your habits. Therefore:
- we turn it on **only when needed** (when you create or search for a POI, or navigate), never continuously in the background;
- we always ask permission through the browser or the device;
- you can refuse it or withdraw it at any time from the browser or device settings, and from the app settings.

### 2.4 Photos you upload
- **Photos of places (POIs)** and **profile photos** that you choose to upload.

*Why:* to document and illustrate places, and to personalise your profile.

Read **section 4** carefully, on consent and photos: photos can portray people, and there are precise rules and responsibilities here.

The photos you upload are processed and stored through our media server media.poilove.com (see section 5). To reduce risk, when you upload a photo we **remove the EXIF metadata** (which includes precise GPS, date, device model) before publishing it. If you use a photo to create a POI, we may read the GPS position in its metadata for the sole purpose of proposing the point on the map: that data is not republished with the photo.

### 2.5 Content you create
- **POIs** (places you save), **loves and favourites**, **lists**, **travel itineraries** with their stops, **travel companion groups**, and **follow** relationships (who you follow and who follows you).

*Why:* this is the heart of the app. It builds your map, shares places, organises trips and follows other people.

**Free tags on POIs.** When you create a POI you can add free text tags (up to 10). Tags on public POIs are visible to the whole community and are used as autocomplete suggestions, including for people who are not signed in. Do not put personal data, yours or anyone else's, in tags.

**Reporting a missing category.** If you report that a category is missing, we record the term you searched for along with your user identifier, so we can update and curate the platform's categories.

**Transferring and claiming a POI.** If you transfer a POI through a code or claim ownership of a place, we process the identity of the person transferring and of the person receiving (identifiers and public name) and any free text messages you write in the request: this data is visible to the administration in order to handle and validate the operation.

Some of this content may include data about **other people** (for example the members of a travel companion group, or the email of someone you invite). See section 4.4.

### 2.6 Invitations and companion groups
- When you invite someone to a travel companion group, we process the **recipient's email** and an **invitation code** to deliver the link.

*Why:* to let you invite other people. The invited person can accept or ignore. We send a single invitation, with the option not to receive further messages.

### 2.7 Gamification and referrals
- **Points**, the events that generate them (for example creating a POI, giving a love, sharing), and **referrals** (invitations that lead to new sign-ups).

*Why:* to run the points system, recognise your contributions and prevent abuse and fraud. We record only the actions that generate points, not every single click.

### 2.8 Reports and moderation
- When you **report** content or a profile, we record the **report** (what you reported, the reason, the date) and who sent it.
- When we act for moderation purposes, we record the **moderation actions** (for example suspension, block, removal of content) and their reason.

*Why:* to keep the platform safe, handle reports, protect people and comply with legal obligations. We also keep this data as evidence in cases of abuse or dispute.

### 2.9 Support messages and communications from the team
- To assist and inform you, an **administrator or moderator** can send you **direct messages** that appear in your chat with ILLI•AI, clearly marked as written by a **person from the team** (label "Human") and distinct from the assistant's automatic replies. You can **reply**: the conversation (message text, date and time, read status) is visible **only to you and the team**, never to other users.

*Why:* to give you support, answer your questions and tell you about the service (for example news, offers or any prizes connected with the app). Legal basis: **performance of the contract** and our **legitimate interest** in offering you support. We do not use these messages for advertising profiling and you can ask us at any time to stop them.

### 2.10 Paid subscriptions
- If you take out a **subscription** to one of the paid tiers (**Professional, Professional Plus, Supporter, Patron**, and dedicated profiles such as **Influencer**), we process the data needed to manage it: chosen tier, subscription status, activation and renewal or termination dates, and the connected benefits.
- The **payment data** itself (for example card details) is processed directly by the payment provider we use at the time of activation, under its own policy: we do not keep card numbers.

*Why:* to activate and manage the subscription, grant you the tier's benefits, issue any accounting documents and comply with tax and legal obligations.

### 2.11 What we do NOT save
- The **history of address searches** is not kept in our database: it stays in the session.
- **Voice dictation**, if you use it, is converted to text by your device or browser: **we neither record nor keep the audio**.

## 3. Legal bases for processing

Every processing operation has a precise legal basis (art. 13 of law 124/2024, art. 6 GDPR):

| Data | Legal basis |
|------|-------------|
| Email, password, login data | **Performance of the contract**: without it we cannot give you the service |
| Username, name, avatar, bio | **Performance of the contract** and our **legitimate interest** in running the platform and preventing abuse |
| GPS location | **Explicit consent**, which you can withdraw at any time |
| Photos you upload | **Explicit consent** to the upload; for photos portraying people see section 4 |
| Content (POIs, lists, itineraries, follows, companion groups) | **Performance of the contract** |
| Invitation emails to companion groups | Your **consent** to sending, and your declaration that you have the recipient's consent |
| Points, events, referrals | **Legitimate interest** in running gamification and preventing fraud |
| Messages to the AI assistant (ILLI and the administrative copilot) | **Performance of the contract** to provide the feature you asked for, and our **legitimate interest** in running and improving the assistant |
| Reports and moderation actions | **Legitimate interest** in the safety of the platform and of its users, and **legal obligation** where we must keep them or act |
| Paid subscription management data | **Performance of the subscription contract** and **legal obligation** for accounting and tax purposes |
| Aggregated usage statistics | **Legitimate interest**, in anonymous or pseudonymised form |

In short, the bases we rely on are **consent** (for location, photos and invitations), **performance of the contract** (for account, content, AI assistant and subscriptions), **legitimate interest** (for safety, prevention of abuse and fraud, gamification and aggregated statistics) and **legal obligation** (for moderation, accounting and tax where the law requires it).

Where the basis is **consent** or **legitimate interest**, you always have the right to withdraw consent or to object (see section 8).

## 4. Consent, location and photos: read this

This is the most important section for your protection and for other people's.

### 4.1 How consent works
The consent we ask for is **free, informed, specific and unambiguous**: you give it by a clear action (for example by turning on a feature or ticking a box), never by pre-ticked boxes or by silence. We ask for **separate** consents for different things: one for location, one for uploading photos. You can accept one and not the other.

You can **withdraw consent at any time**, and it is as easy as giving it: from the app, browser or device settings. Withdrawal applies to the future and does not make unlawful what we processed before, lawfully, while the consent was active.

### 4.2 Location
We turn on GPS only when you need a feature that requires it, and we tell you. When you close that feature, we stop using it. If you decide to make a list or a companion group public, remember that the connected location can become visible to others: think carefully about what you share.

### 4.3 Photos: what you may and what you must NOT upload
Photos you upload to a POI are, by their nature, meant to be **seen by other people**. Before uploading a photo, read these rules. By uploading a photo you declare that you respect them and you take responsibility for it.

**What you must NOT upload:**
- Photos portraying **recognisable people** (identifiable faces) **without their consent**. This applies to people in the background too, not only the main subject.
- Photos of **minors** without the consent of whoever holds parental responsibility.
- Photos that allow a person to be **recognised or uniquely identified** by their face (biometric data): this kind of processing is forbidden without the explicit and specific consent of the person concerned.
- Photos that infringe someone's **privacy, dignity or rights**, unlawful, offensive or sexually explicit content, or content you do not hold the rights to.
- Documents, number plates, health data or other sensitive information about other people.

**What we recommend:**
- Prefer photos of the **place without recognisable people**: they are the safest for everyone.
- If people are present, make sure you have their consent, or make the faces unrecognisable.

**Your responsibility.** When you upload a photo portraying other people, you are the one responsible, towards those people, for collecting their consent. POI•LOVE provides the tool, but the choice of what to upload is yours. If we receive a report or a legitimate request, we promptly remove the problematic content (see section 8 for reports).

### 4.4 Other people's data in your content
When you invite someone to a travel companion group or include other people in your content, you give us data about them (for example an email address). You must do so only if you have a legitimate basis for sharing it, and you declare that you have. Anyone invited can always refuse and ask for their data to be removed.

### 4.5 Visibility and default settings
We work so that the most prudent settings are the default ones (for example companion groups private to begin with, and the follow graph not freely browsable by anyone). When you choose to make something public, we tell you.

Some suppliers (in particular **OpenAI**, **Anthropic** and **Google**) have servers in the **United States**, and **Supabase** too may have components there. Sending your data there is a transfer to a third country, which the United States, in general, is not considered adequate by either Albania or the EU.

- **adequate contractual safeguards** (for example standard data protection clauses) offered by those suppliers, and, where Albanian law requires it, on the **prior authorisation of the Authority (Commissioner)**;
- failing such safeguards, your **explicit consent, informed about the risks** of the transfer, for example when you choose to use the ILLI assistant or place searches that need those services.

Transferring data to the United States means that authorities of that country may, in certain cases, access it with protections different from the European and Albanian ones. We try to **minimise** the data sent: for example the AI assistant (OpenAI or Anthropic) receives your messages and the area you are talking about, not your name or your account; and Google Places receives the search text and the area, not your identity. If you do not want certain data to leave the EU/Albania area, you can avoid using the features that rely on those suppliers (the ILLI assistant, the administrative copilot, searches through Google Places). And in any case, as noted above, do not put sensitive data in chats with the AI assistant.

## 5bis. Processing added after July 2026

Since July 2026 the service does a few more things. We list them here because they concern your data.

**Faces in photos.** When you upload a photo of a place, a program on our machine looks for faces and blurs them automatically, with feathered edges. It protects people who ended up in the frame by chance and gave you no consent. If the program cannot do its job, **the photo is not published**: we would rather lose a photo than publish a stranger's face. From the administration panel we can choose whether to blur everyone's faces or only children's. Photos arrive on the server already blurred: the original with faces in the clear is not kept.

**Reviews.** You can write a review of a place belonging to someone you are connected with. Before it appears, the text is read by an artificial intelligence program that checks whether it respects the rules written in the panel (no insults, no other people's data, no advertising). The text of the review is therefore sent to OpenAI or Anthropic, as with the ILLI assistant. If the program is not sure, the review waits and a person looks at it.

**Venue data.** If you run a business, you can publish opening hours, menu, telephone and payment methods. This is data you choose to make public. We also count how many times your card is opened and how many times your QR code is scanned: those numbers are visible only to you, and are not tied to the identity of whoever is looking.

**Voice and video.** You can record your voice on a place and upload a video. They stay on our machine in Germany. Voice messages in travel companion groups are also transcribed into text, and for that the audio file is sent to OpenAI.

**Subscriptions.** If you have a paid tier we keep the expiry date, the payment reference you give us and the history of renewals. We do not process your card data: payment happens outside the platform.

**Reports.** Anyone can report content. A report keeps who made it, what it concerns and the reason, and is looked at within twenty-four hours.

**Email.** Service emails (sign-in links, notices) go out through **AcumbaMail**, which receives your address and the content of the message. Its servers are in **Spain**, European Union.

## 6. How long we keep data

| Data | Retention |
|------|-----------|
| Account, profile, content (POIs, lists, itineraries, follows) | As long as your account is active. When the account is deleted we erase or anonymise it |
| Uploaded photos | As long as they stay in your content or until the account is deleted, or earlier at your request |
| GPS location | Kept only if you save it inside content (a POI, a stop). We do not keep a continuous history of your movements |
| Gamification and referral events | For as long as the points system and fraud prevention need it, with periodic deletion of older data |
| Companion invitation emails | For as long as handling the invitation requires |
| Messages to the AI assistant | As long as needed to give you the answer and run the assistant. Retention on the supplier's side (OpenAI, Anthropic) follows their own policies |
| Reports and moderation actions | For as long as platform safety requires and, where required, to comply with legal obligations or defend a right |
| Subscription management data | For the duration of the subscription and, for accounting and tax documents, for the period set by law |
| Authentication data | As long as the account exists |

When data is no longer necessary for the purposes it was collected for, we delete it or make it anonymous. Some data may be kept longer if needed to comply with legal obligations or to defend a right in legal proceedings.

---

## 7. How we protect your data (security)

We adopt technical and organisational measures to protect your data, including:
- **Row Level Security (RLS)** on the database: each person can reach only the data they are entitled to.
- **API keys kept on the server side**, behind protected functions (Edge Functions): they never travel in the browser and are not exposed to users.
- **HTTPS** on all connections: data travels encrypted.
- **Internal project files blocked** from the public side of the site, so they cannot be reached from outside.
- **Encrypted passwords** and authentication handled by specialised software.
- **Removal of EXIF metadata** from photos before publication.

No system is 100% secure. If a data breach occurred with risk to your rights, we would notify the Authority (Commissioner) within **72 hours** and, in high-risk cases, you too without undue delay, as the law provides.

---

## 8. Your rights and how to exercise them

You have full control over your data. Under law 124/2024 and the GDPR you can:

- **Access** your data and obtain a copy (the first one is free).
- **Rectify** inaccurate or incomplete data.
- **Erase** your data and **close your account**: account deletion is in your profile settings, and it erases or anonymises your data. You can also ask us in writing.
- **Object** to processing based on legitimate interest, and in particular object absolutely to any direct marketing communication.
- **Restrict** processing in certain cases.
- **Portability**: receive your data in a structured, readable format and, where technically possible, have it transferred to others.
- **Withdraw consent** at any time, for location, photos or any processing based on consent.

To exercise these rights, or to report a photo or content concerning you, write to **it@altrostile.app**. We answer **within 30 days** of the request. Answers are free; for further copies we may ask a reasonable contribution towards costs.

We do not use your data to take **decisions based solely on automated processing** producing legal effects on you or significantly affecting you. Should that change, we will tell you and explain the logic and the consequences.

---

## 9. Minors

POI•LOVE is not designed for children. To use it, and for processing based on consent, you must be **at least 16 years old**. If you are under 16, you may use it only with the consent of whoever holds parental responsibility.

We do not knowingly collect data from minors below that threshold without the required consent. If you are a parent or guardian and believe a minor has given us data without the proper consent, write to us at **it@altrostile.app**: we will promptly remove that data.

---

## 10. Changes to this policy

We may update this policy, for example if we add features or change suppliers. When a change is significant we tell you in the app or by email and we update the date at the top. We invite you to reread it from time to time. Continued use of the app after an update counts as having seen the most recent version.

This policy is available in **Italian, Albanian and English**. In case of interpretative doubt, the version we use as the official reference at launch prevails.

---

## 11. Complaint to the Authority

If you believe the processing of your data breaches the law, you can always lodge a complaint with the competent supervisory authority.

In Albania this is the **Commissioner for the Right to Information and Protection of Personal Data (Komisioneri për të Drejtën e Informimit dhe Mbrojtjen e të Dhënave Personale, IDP)**, website **idp.al**.

function setLingua(lg){
  if(['it','sq','en'].indexOf(lg) < 0) lg = 'en';
  try{ localStorage.setItem('poilove_legale_lang', lg); }catch(e){}

  document.documentElement.lang = lg;
  document.title = TITOLI[lg] + ' · POI•LOVE';
  var back = document.querySelector('.topbar .back'); if(back) back.textContent = TORNA[lg];
  var bb = document.querySelectorAll('#lingue button');
  for(var i=0;i<bb.length;i++){ bb[i].className = (bb[i].getAttribute('data-lg')===lg) ? 'on' : ''; }
}
(function(){
  var salvata = null;
  try{ salvata = localStorage.getItem('poilove_legale_lang'); }catch(e){}
  var nav = (navigator.language || 'en').slice(0,2).toLowerCase();
  setLingua(salvata || (nav==='it' ? 'it' : nav==='sq' ? 'sq' : 'en'));
})();
