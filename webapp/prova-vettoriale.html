  IL PARCO GIOCHI DEL VETTORIALE (27/08/2026, voluto dal founder: "me li
  puoi far arrivare tutti nella pagina di prova?"). Tutte le funzioni che
  il motore MapLibre apre, toccabili una per una, su dati VERI:
  viste, tema scuro, nomi in tre lingue, edifici 3D, mappa di calore dei
  love, volo cinematografico, globo. La mappa di produzione resta com'e'
  finche' il blocco 71 non porta il motore anche li'.

<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POI•LOVE · Parco giochi vettoriale</title>
<link rel="icon" href="/img/favicon.svg">
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#mappa{height:100%;width:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .fascia{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;
    background:#16130f;color:#fff;border-radius:24px;padding:8px 16px;font-size:12.5px;
    font-weight:800;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.3);white-space:nowrap}
  .fascia b{color:#f3b3a5}
  .fascia a{color:#fff;opacity:.8;text-decoration:underline}
  .pannello{position:fixed;top:12px;left:12px;z-index:10;display:flex;flex-direction:column;
    gap:8px;background:rgba(255,255,255,.94);border-radius:16px;padding:10px 12px;
    box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:210px}
  .gruppo{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .gruppo em{flex-basis:100%;font-style:normal;font-size:9.5px;font-weight:900;
    letter-spacing:.12em;text-transform:uppercase;color:#8a8177}
  .pannello button{background:#eee7dc;border:none;border-radius:14px;padding:6px 11px;
    font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;color:#3a322c}
  .pannello button.on{background:#16130f;color:#fff}
  .pin{display:flex;flex-direction:column;align-items:center;cursor:pointer}
  .pin svg.goccia{width:42px;height:50px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
  .pin .nome{margin-top:3px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;
    font-weight:700;border-radius:6px;padding:2px 6px;max-width:104px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;letter-spacing:.2px}
  .pin .love{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;background:#fff;color:#111;
    font-size:10px;font-weight:900;border-radius:99px;border:1.5px solid #D42B2B;
    padding:0 4px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .pin .corpo{position:relative}
  @media(max-width:700px){.fascia{display:none}}
</style></head>
<body>
<div class="fascia">PARCO GIOCHI <b>vettoriale</b> · <a href="https://poilove.com/">l'app vera</a></div>
<div class="pannello">
  <div class="gruppo"><em>Vista</em>
    <button id="bStrade" class="on" onclick="setVista('strade')">Stradale</button>
    <button id="bSat" onclick="setVista('satellite')">Satellite</button>
    <button id="bVie" class="on" onclick="flip('vie')" style="display:none">Vie</button>
  </div>
  <div class="gruppo"><em>Tema (stradale)</em>
    <button id="bChiaro" class="on" onclick="setTema('chiaro')">Chiaro</button>
    <button id="bScuro" onclick="setTema('scuro')">Scuro</button>
  </div>
  <div class="gruppo"><em>Nomi</em>
    <button id="bSq" onclick="setLingua('sq')">SQ</button>
    <button id="bIt" onclick="setLingua('it')">IT</button>
    <button id="bEn" onclick="setLingua('en')">EN</button>
  </div>
  <div class="gruppo"><em>Prodigi</em>
    <button id="b3d" onclick="flip('tre3d')">3D</button>
    <button id="bCalore" onclick="flip('calore')">Calore</button>
    <button id="bGlobo" onclick="flip('globo')">Globo</button>
    <button onclick="volo()">Volo</button>
  </div>
</div>
<div id="mappa"></div>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
/* ── Gli stili ── */
const CARTO_KEY = 'cb1_2b26_1_902b9cb06a1ccd6e2a9ac61b';
const STILE_CHIARO = 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json';
const STILE_SCURO  = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
const STILE_SATELLITE = {
  version: 8,
  sources: {
    foto: { type: 'raster', tileSize: 256, maxzoom: 18, attribution: '&copy; Esri',
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] },
    strade: { type: 'raster', tileSize: 256, maxzoom: 18,
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}'] },
    nomi: { type: 'raster', tileSize: 256, maxzoom: 18,
      tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'] },
  },
  layers: [
    { id: 'foto', type: 'raster', source: 'foto' },
    { id: 'strade', type: 'raster', source: 'strade' },
    { id: 'nomi', type: 'raster', source: 'nomi' },
  ],
};

/* ── Lo stato del parco giochi ── */
const S = { vista: 'strade', tema: 'chiaro', lingua: null, vie: true, tre3d: false, calore: false, globo: false };
let luoghi = [];        // i luoghi VERI dal database
let marcatori = [];     // i cuori sopra la mappa

const mappa = new maplibregl.Map({
  container: 'mappa',
  style: STILE_CHIARO,
  center: [19.8187, 41.3275],
  zoom: 13,
  attributionControl: true,
});
mappa.addControl(new maplibregl.NavigationControl(), 'bottom-right');
mappa.on('load', () => mappa.resize());
setTimeout(() => mappa.resize(), 400);
new ResizeObserver(() => mappa.resize()).observe(document.getElementById('mappa'));

/* ── I comandi ── */
function bott(id, acceso) { const b = document.getElementById(id); if (b) b.classList.toggle('on', acceso); }

function stileCorrente() {
  return S.vista === 'satellite' ? STILE_SATELLITE : (S.tema === 'scuro' ? STILE_SCURO : STILE_CHIARO);
}
function cambiaStile() {
  mappa.setStyle(stileCorrente());
  mappa.setMaxZoom(S.vista === 'satellite' ? 18.4 : 20);
  mappa.once('styledata', () => { mappa.resize(); applicaTutto(); });
  /* Il rimisura ritardato NON deve tagliare un'animazione in corso
     (il volo o l'inclinazione appena chiesti): misurato il 27/08. */
  setTimeout(() => { if (!mappa.isEasing()) mappa.resize(); applicaTutto(); }, 900);
}
function setVista(v) {
  S.vista = v; cambiaStile();
  bott('bStrade', v === 'strade'); bott('bSat', v === 'satellite');
  document.getElementById('bVie').style.display = v === 'satellite' ? '' : 'none';
}
function setTema(t) {
  S.tema = t;
  bott('bChiaro', t === 'chiaro'); bott('bScuro', t === 'scuro');
  if (S.vista !== 'satellite') cambiaStile();
}
function setLingua(l) {
  S.lingua = (S.lingua === l) ? null : l;
  for (const id of ['bSq', 'bIt', 'bEn']) bott(id, false);
  if (S.lingua) bott('b' + l.charAt(0).toUpperCase() + l.slice(1), true);
  applicaLingua();
}
function flip(quale) {
  S[quale] = !S[quale];
  bott({ vie: 'bVie', tre3d: 'b3d', calore: 'bCalore', globo: 'bGlobo' }[quale], S[quale]);
  if (quale === 'vie') applicaVie();
  if (quale === 'tre3d') applica3d(true);
  if (quale === 'calore') applicaCalore(true);
  if (quale === 'globo') applicaGlobo(true);
}

/* Dopo OGNI cambio di vestito si riapplica quello che era acceso. */
function applicaTutto() { applicaVie(); applicaLingua(); applica3d(); applicaCalore(); applicaGlobo(); }

/* Le vie sopra il satellite. */
function applicaVie() {
  if (S.vista !== 'satellite') return;
  for (const id of ['strade', 'nomi']) {
    try { mappa.setLayoutProperty(id, 'visibility', S.vie ? 'visible' : 'none'); } catch (_) {}
  }
}

/* I nomi nella lingua scelta: le tegole vettoriali portano piu' lingue,
   dove la traduzione manca si ricade sul nome del posto. */
function applicaLingua() {
  if (S.vista === 'satellite') return;   // il satellite ha nomi raster, non si traducono
  const campo = S.lingua
    ? ['coalesce', ['get', 'name_' + S.lingua], ['get', 'name:' + S.lingua], ['get', 'name']]
    : null;
  for (const l of (mappa.getStyle()?.layers || [])) {
    if (l.type !== 'symbol') continue;
    try {
      const tf = mappa.getLayoutProperty(l.id, 'text-field');
      if (!tf) continue;
      if (campo) {
        if (!l.metadata || !l.metadata._tfOrig) {
          try { mappa.getStyle().layers.find(x => x.id === l.id).metadata = { _tfOrig: tf }; } catch (_) {}
        }
        mappa.setLayoutProperty(l.id, 'text-field', campo);
      }
    } catch (_) {}
  }
  if (!campo) cambiaStile();   // tornare ai nomi originali = rivestirsi da capo, semplice e onesto
}

/* Gli edifici in rilievo, dai perimetri veri delle tegole (dove l'altezza
   manca si usa un'altezza di cortesia, dichiarata qui). */
function applica3d(anima) {
  if (S.vista === 'satellite') return;
  try { if (mappa.getLayer('prova-3d')) mappa.removeLayer('prova-3d'); } catch (_) {}
  if (S.tre3d) {
    const rif = (mappa.getStyle()?.layers || []).find(l => l['source-layer'] === 'building');
    if (rif) {
      mappa.addLayer({
        id: 'prova-3d', type: 'fill-extrusion', source: rif.source, 'source-layer': 'building',
        minzoom: 14,
        paint: {
          'fill-extrusion-color': S.tema === 'scuro' ? '#4a443e' : '#d6c6b2',
          'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 12],
          'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
          'fill-extrusion-opacity': 0.75,
        },
      });
    }
  }
  if (anima) mappa.easeTo({ pitch: S.tre3d ? 55 : 0, duration: 900 });
}

/* La mappa di calore dei LOVE: i luoghi veri come zone che si accendono. */
function applicaCalore(anima) {
  try { if (mappa.getLayer('prova-calore')) mappa.removeLayer('prova-calore'); } catch (_) {}
  try { if (mappa.getSource('prova-calore')) mappa.removeSource('prova-calore'); } catch (_) {}
  for (const m of marcatori) m.getElement().style.display = S.calore ? 'none' : '';
  if (!S.calore) return;
  mappa.addSource('prova-calore', { type: 'geojson', data: {
    type: 'FeatureCollection',
    features: luoghi.map(p => ({ type: 'Feature', properties: { w: (p.love_count || 0) + 1 },
      geometry: { type: 'Point', coordinates: [p.lng, p.lat] } })),
  }});
  mappa.addLayer({ id: 'prova-calore', type: 'heatmap', source: 'prova-calore',
    paint: {
      'heatmap-weight': ['get', 'w'],
      'heatmap-radius': ['interpolate', ['linear'], ['zoom'], 10, 22, 16, 55],
      'heatmap-intensity': 1.1,
      'heatmap-color': ['interpolate', ['linear'], ['heatmap-density'],
        0, 'rgba(212,43,43,0)', 0.25, 'rgba(240,150,90,.45)',
        0.55, 'rgba(230,90,60,.7)', 1, 'rgba(212,43,43,.95)'],
    }});
  if (anima) mappa.easeTo({ pitch: 0, duration: 600 });
}

/* Il globo: da Tirana alla Terra intera. */
function applicaGlobo(anima) {
  try { mappa.setProjection({ type: S.globo ? 'globe' : 'mercator' }); } catch (_) {}
  if (!anima) return;
  if (S.globo) mappa.flyTo({ center: [19.8187, 41.3275], zoom: 1.6, pitch: 0, duration: 3500, essential: true });
  else mappa.flyTo({ center: [19.8187, 41.3275], zoom: 13, duration: 3000, essential: true });
}

/* Il volo cinematografico sul luogo piu' amato. */
function volo() {
  const meta = luoghi.slice().sort((a, b) => (b.love_count || 0) - (a.love_count || 0))[0];
  if (!meta) return;
  mappa.flyTo({ center: [meta.lng, meta.lat], zoom: Math.min(17.5, S.vista === 'satellite' ? 18.3 : 17.5),
    pitch: S.vista === 'satellite' ? 0 : 55, bearing: 25, duration: 6000, essential: true });
}

/* ── I luoghi VERI, con la goccia della webapp ── */
function pinHtml(nome, love, colore) {
  const badge = love > 0 ? '<div class="love">' + (love > 999 ? Math.round(love / 100) / 10 + 'k' : love) + '</div>' : '';
  return '<div class="pin"><div class="corpo">' +
    '<svg class="goccia" viewBox="0 0 80 96"><path d="M40 90C37 88 8 66 8 40 8 22 21 8 40 8s32 14 32 32c0 26-29 48-32 50z" fill="' + colore + '" stroke="#fff" stroke-width="4"/>' +
    '<path d="M40 30c-5-6-15-4.5-17 3-2 7 4.5 12 17 22 12.5-10 19-15 17-22-2-7.5-12-9-17-3z" fill="#fff"/></svg>' + badge +
    '</div><div class="nome"></div></div>';
}
const DB = 'https://poilove.com/db/rest/v1';
const CHIAVE_PUBBLICA = 'sb_publishable_PC1xQ8XiQK9jpzwsAlFLxw_E-PKN40V';
fetch(DB + '/pois?select=title,title_it,lat,lng,love_count,visibility,badge_official' +
      '&visibility=in.(community,official)&is_approved=is.true&removed_at=is.null' +
      '&order=love_count.desc&limit=200', { headers: { apikey: CHIAVE_PUBBLICA } })
  .then(r => r.json())
  .then(lista => {
    luoghi = lista || [];
    luoghi.forEach(p => {
      const ufficiale = p.visibility === 'official' || p.badge_official;
      const el = document.createElement('div');
      el.innerHTML = pinHtml(p.title_it || p.title || '', p.love_count || 0, ufficiale ? '#285EA7' : '#D42B2B');
      const dentro = el.firstChild;
      dentro.querySelector('.nome').textContent = (p.title_it || p.title || '').substring(0, 11);
      marcatori.push(new maplibregl.Marker({ element: dentro, anchor: 'bottom' })
        .setLngLat([p.lng, p.lat]).addTo(mappa));
    });
  })
  .catch(() => {});
</script>
</body></html>
