*{box-sizing:border-box;margin:0;padding:0}

.hero p b{color:var(--red)}
.hero .note{font-size:14px;color:var(--muted);margin-top:12px}

.big{background:var(--white);border-radius:16px;padding:26px 30px;margin-bottom:24px;border:1px solid var(--line)}
.big .brow{display:grid;grid-template-columns:230px 1fr 120px;gap:16px;align-items:center;padding:14px 0}
.big .brow+.brow{border-top:1px solid #f0ece2}
.big .blbl{font-weight:800;font-size:15.5px;line-height:1.3}
.big .blbl small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.big .bbar{height:34px;border-radius:8px}
.big .b1 .bbar{background:#c3bcab}
.big .b2 .bbar{background:var(--red)}
.big .b3 .bbar{background:var(--green)}
.big .bval{font-size:23px;font-weight:800;text-align:right;letter-spacing:-.5px}
.big .b3 .bval{color:var(--green)}
.big .bnote{font-size:12px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid #f0ece2}
.machines{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.m{background:var(--white);border-radius:14px;padding:20px;border:2px solid var(--line)}
.m.now{border-color:var(--red)}
.m .tag{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--muted);margin-bottom:10px}
.m.now .tag{color:var(--red)}
.m .power{font-size:27px;font-weight:800;letter-spacing:-.5px;margin-bottom:3px}
.m .who{font-size:14px;color:var(--muted);margin-bottom:14px}
.m dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13.5px}
.m dt{color:var(--muted)}
.m dd{text-align:right;font-weight:700}
.m dd.good{color:var(--green)}
.chart{background:var(--white);border-radius:14px;padding:22px 26px;border:1px solid var(--line)}
.row{display:grid;grid-template-columns:150px 1fr 78px;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid #f0ece2}
.row:last-child{border-bottom:none}
.row .label{font-weight:700;font-size:14px}
.row .label span{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.pair{display:grid;gap:5px}
.b{display:flex;align-items:center;gap:9px}
.b i{display:block;height:15px;border-radius:4px}
.b.old i{background:#c3bcab}
.b.new i{background:var(--red)}
.b.db i{background:var(--green)}
.b span{font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.b.new span{color:var(--red);font-weight:700}
.b.db span{color:var(--green);font-weight:700}
.win{text-align:right;font-size:19px;font-weight:800;color:var(--green)}
.win small{display:block;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.key{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:14px;padding-top:13px;border-top:1px solid #f0ece2}
.key b{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.two{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
.box{background:var(--white);border-radius:14px;padding:22px 25px;border:1px solid var(--line)}
.box h3{font-size:19px;margin-bottom:11px;letter-spacing:-.3px}
.box p{font-size:14.5px;line-height:1.62;margin-bottom:11px}
.box p:last-child{margin-bottom:0}
.box p b{color:var(--red)}
.box .quiet{color:var(--muted);font-size:13.5px}
.db{display:flex;gap:14px;margin:16px 0}
.dbc{flex:1;background:var(--soft);border-radius:11px;padding:15px;text-align:center;border:1px solid var(--line)}
.dbc .v{font-size:29px;font-weight:800;color:var(--red);letter-spacing:-1px}
.dbc.win2 .v{color:var(--green)}
.dbc .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
/* ── IL SALTO: 12 misure vere per fase, barre animate ── */
.leap{background:var(--white);border-radius:16px;padding:26px 30px;margin-bottom:24px;border:1px solid var(--line)}
.leap svg{width:100%;height:auto;display:block}
.sb{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:sbGrow .7s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes sbGrow{to{transform:scaleY(1)}}
.spike{animation:sbGrow .7s cubic-bezier(.2,.7,.3,1) forwards, spikePulse 2.6s 1.4s ease-in-out infinite}
@keyframes spikePulse{0%,100%{opacity:1}50%{opacity:.55}}
.glide{animation:glideX 3.2s 1.2s linear infinite}
@keyframes glideX{0%{transform:translateX(0)}100%{transform:translateX(388px)}}
.leap .db{margin-top:18px}
footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);
 display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
@media print{
 body{background:#fff;padding:0;font-size:11.5px}
 .back,.langs{display:none}
 h1{font-size:26px}.hero p{font-size:14px}
 .hero,.chart,.box,.m,.big{border:1px solid #ddd;border-radius:9px;padding:13px 15px}
 h2{margin:16px 0 8px;font-size:11px}
 .m .power{font-size:19px}.row{padding:7px 0}
 .box h3{font-size:14px}.box p{font-size:11.5px;margin-bottom:7px}
 .dbc .v{font-size:20px}.machines,.two{gap:9px}

}
@media(max-width:860px){

 .row{grid-template-columns:110px 1fr 60px;gap:9px}
 h1{font-size:29px}
 .big .brow{grid-template-columns:1fr;gap:6px}
 .big .bval{text-align:left}
}

function setL(l){
 localStorage.setItem('vel_lang',l);
 document.documentElement.lang=l;
 const d=T[l];
 document.querySelectorAll('[data-t]').forEach(e=>{ const k=e.getAttribute('data-t'); if(d[k]!=null) e.innerHTML=d[k]; });
 ['sq','it','en'].forEach(x=>document.getElementById('lb-'+x).classList.toggle('on',x===l));
 chartLabels(d); barre();
 const MAX=373;
 document.getElementById('pages').innerHTML=ROWS.map(r=>`
  <div class="row">
   <div class="label">${d[r.k]}<span>${d[r.k+'s']}</span></div>
   <div class="pair">
    <div class="b old"><i style="width:${Math.round(r.old/MAX*100)}%"></i><span>${r.old}</span></div>
    <div class="b new"><i style="width:${Math.round(r.now/MAX*100)}%"></i><span>${r.now} ${d.ms}</span></div>
    <div class="b db"><i style="width:${Math.round(r.db/MAX*100)}%"></i><span>${r.db} · 18/08</span></div>
   </div>
   <div class="win">-${r.gain}%<small>${d.faster}</small></div>
  </div>`).join('')+`
  <div class="key">
   <span><b style="background:#c3bcab"></b> ${d.legend1}</span>
   <span><b style="background:#D42B2B"></b> ${d.legend2}</span>
   <span><b style="background:#1a7f45"></b> ${d.legend3}</span>
   <span style="margin-left:auto">${d.blink}</span>

const PRIMA=[97,98,127,132,135,144,160,172,172,176,222,794];
const ADESSO=[19,18,21,19,18,19,27,30,27,19,2,3];
function barre(){
  const MAXV=794, H=190, BASE=248, W=27, GAP=6;
  const mk=(vals,x0,color,cls)=>vals.map((v,i)=>{
    const h=Math.max(4, v/MAXV*H), x=x0+i*(W+GAP);
    const sp=(v>600)?` class="sb spike"`:` class="sb"`;
    return `<rect${sp} x="${x}" y="${BASE-h}" width="${W}" height="${h}" rx="4" fill="${color}" style="animation-delay:${i*0.06}s"></rect>`
      +((v>600)?`<text x="${x+W/2}" y="${BASE-h-8}" text-anchor="middle" font-size="12" font-weight="800" fill="#D42B2B">794</text>`:'');
  }).join('');
  document.getElementById('gPrima').innerHTML=mk(PRIMA,42,'#c3bcab');
  document.getElementById('gAdesso').innerHTML=mk(ADESSO,552,'#1a7f45');
}
function chartLabels(d){
  document.getElementById('lblPrima').textContent=d.c_prima;
  document.getElementById('lblAdesso').textContent=d.c_adesso;
  document.getElementById('lblRuns1').textContent=d.c_runs;
  document.getElementById('lblRuns2').textContent=d.c_runs;
  document.getElementById('lblSpike').textContent=d.c_spike;
  document.getElementById('lblFlat').textContent=d.c_flat;
  document.getElementById('blinkLbl').textContent=d.blink;
}
